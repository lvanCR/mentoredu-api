spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 20000
      initialization-fail-timeout: 60000
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM_ADDRESS:noreply@mentoredu.com}
    admin-to: ${ADMIN_CONTACT_EMAIL:noreply@mentoredu.com}
    sendgrid:
      api-key: ${SENDGRID_API_KEY}
  file-service:
    base-url: ${FILE_SERVICE_URL}
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://mentoredu-frontend.onrender.com}
  landing:
    base-url: ${LANDING_BASE_URL:https://mentoredu-app.github.io}
