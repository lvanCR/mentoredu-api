spring:
  main:
    lazy-initialization: true
    banner-mode: off
  mvc:
    log-resolved-exception: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 21MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        api-key: ${OPENAI_CHAT_API_KEY:${OPENAI_API_KEY}}
        base-url: https://api.openai.com/v1
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        api-key: ${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY}}
        base-url: https://api.openai.com/v1
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:60}
  file-service:
    base-url: ${FILE_SERVICE_URL:http://localhost:8081}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

