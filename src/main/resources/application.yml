spring:
  main:
    lazy-initialization: true
    banner-mode: off
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 21MB

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:60}
  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads/resources}
    max-size-mb: ${FILE_MAX_SIZE_MB:20}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
