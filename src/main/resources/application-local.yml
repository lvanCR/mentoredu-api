spring:
  config:
    import: optional:dotenv:.env
  datasource:
    url: jdbc:postgresql://localhost:5432/mentoredu_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

server:
  port: 8080

jwt:
  secret: mentoredu-clave-secreta-super-larga-para-hs256-minimo-32-caracteres
  expiration: 86400000
