spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mentoredu}
    username: ${DB_USERNAME:mentoredu}
    password: ${DB_PASSWORD:mentoredu}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
